name: Web CI

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]

permissions:
  contents: read

jobs:
  build:
    name: Check and build web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Test Docker image build
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://uat.progressrooms.com/api/v1 \
            --tag progressrooms-web:ci \
            .
