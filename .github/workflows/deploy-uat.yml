name: Deploy Web to UAT

on:
  push:
    branches: [uat]

permissions:
  contents: read

concurrency:
  group: web-uat-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository code
        uses: actions/checkout@v5

      - name: Build UAT image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://uat.progressrooms.com/api/v1 \
            --tag progressrooms-web-uat:${{ github.sha }} \
            .

      - name: Save image for transfer
        run: |
          set -euo pipefail
          docker save progressrooms-web-uat:${{ github.sha }} \
            | gzip > web-${{ github.sha }}.tar.gz

      - name: Transfer image to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: web-${{ github.sha }}.tar.gz
          target: /opt/progressrooms/uat/incoming
          command_timeout: 10m

      - name: Start UAT application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/progressrooms/uat

            archive="incoming/web-${{ github.sha }}.tar.gz"
            docker load --input "$archive"

            previous_tag=""
            if [ -f .env ]; then
              previous_tag=$(sed -n 's/^IMAGE_TAG=//p' .env)
            fi

            export IMAGE_TAG="${{ github.sha }}"

            if docker compose up -d --no-deps web && \
               curl --fail --silent --show-error \
                 --retry 15 --retry-delay 2 \
                 --retry-connrefused --retry-all-errors \
                 --max-time 5 \
                 http://127.0.0.1:3100/ > /dev/null; then
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env
              rm -f "$archive"
              echo "UAT deployment successful"
            else
              docker compose logs --tail=50 web
              if [ -n "$previous_tag" ]; then
                export IMAGE_TAG="$previous_tag"
                docker compose up -d --no-deps web
              else
                docker compose stop web
              fi
              exit 1
            fi
